{% extends "base.html" %}

{% block content %}

<section class="mx-auto max-w-2xl">
  <div class="rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl backdrop-blur">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-indigo-300">JavaScript + Flask</p>
    <h1 class="mt-3 text-3xl font-bold text-white sm:text-4xl">Calculadora Dinámica</h1>
    <p class="mt-2 text-sm text-slate-300">
      Ingresa dos valores, selecciona la operación que deseas realizar y envía el formulario mediante AJAX.
    </p>

    <form id="calc" class="mt-8 grid gap-5 sm:grid-cols-[1fr_auto_1fr] sm:items-end">
      
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-200">Valor A</span>
        <input name="a" type="number" step="any" required placeholder="0"
          class="w-full rounded-xl border border-white/15 bg-slate-900/60 px-4 py-3 text-white outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/40">
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-200 sm:text-center">Operación</span>
        <select name="operacion" 
          class="w-full rounded-xl border border-white/15 bg-slate-900 px-4 py-3 font-bold text-indigo-300 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/40">
          <option value="suma">+</option>
          <option value="resta">-</option>
          <option value="multiplicacion">×</option>
          <option value="division">÷</option>
        </select>
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-200">Valor B</span>
        <input name="b" type="number" step="any" required placeholder="0"
          class="w-full rounded-xl border border-white/15 bg-slate-900/60 px-4 py-3 text-white outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/40">
      </label>

      <button id="submit-btn" type="submit"
        class="sm:col-span-3 inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60">
        Calcular
      </button>
    </form>

    <div class="mt-6 rounded-xl border border-indigo-400/20 bg-indigo-400/10 px-4 py-3 text-lg">
      <span class="text-slate-300">Resultado:</span>
      <span id="result" class="ml-2 font-bold text-indigo-200">-</span>
    </div>

    <p id="status" class="mt-3 min-h-6 text-sm text-rose-300"></p>
  </div>
</section>

<script>
  function addSubmit(ev) {
    ev.preventDefault();
    
    document.getElementById('status').innerText = "";

    fetch({{ url_for('jscode.add')| tojson }}, {
      method: 'POST',
      body: new FormData(this) 
    })
    .then(parseJSON)
    .then(addShow)
    .catch(err => {
      document.getElementById('status').innerText = "Error procesando el cálculo.";
    });
  }

  function parseJSON(response) {
    return response.json();
  }

  function addShow(data) {
    var span = document.getElementById('result');
    var statusP = document.getElementById('status');
    
    if (data.error) {
      span.innerText = "-";
      statusP.innerText = data.error;
    } else {
      span.innerText = data.result;
    }
  }

  var form = document.getElementById('calc');
  form.addEventListener('submit', addSubmit);
</script>

{% endblock %}
